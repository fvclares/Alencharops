<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz dos Dinossauros</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #a8ede0 0%, #fed6e3 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 6px solid #fff;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff5252;
            font-size: 2.2rem;
            text-align: center;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 0px #ffe082;
        }

        .progresso {
            font-family: 'Fredoka One', cursive;
            background: #ffe082;
            color: #d35400;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        #audio-btn {
            background: linear-gradient(45deg, #ff9f43, #ff6b6b);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            font-family: 'Fredoka One', cursive;
            transition: transform 0.2s, filter 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #audio-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .opcoes-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .opcao-btn {
            background: #fff;
            border: 4px solid #dfe6e9;
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
            width: 220px;
            height: 220px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .opcao-btn:hover {
            transform: translateY(-5px);
            border-color: #ff6b6b;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .opcao-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }

        #feedback {
            margin-top: 25px;
            font-size: 1.5rem;
            text-align: center;
            min-height: 50px;
            font-family: 'Fredoka One', cursive;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Roar! O Quiz dos Dinossauros 🦖</h1>
        <div class="progresso" id="texto-progresso">Pergunta 1 de 10</div>
        
        <button id="audio-btn" onclick="falarPerguntaAtual()">🔊 Ouvir Pergunta Novamente</button>

        <div class="opcoes-container" id="opcoes"></div>

        <div id="feedback"></div>
    </div>

    <script>
        const quizData = [
            {
                pergunta: "Qual deles é o Tiranossauro Rex, o rei dos predadores?",
                correto: 0,
                explicacao: "O Tiranossauro Rex tinha dentes gigantescos e braços bem curtinhos!",
                opcoes: [
                    { nome: "T-Rex", img: "imagens/trex.png" },
                    { nome: "Triceratops", img: "imagens/triceratops.png" },
                    { nome: "Velociraptor", img: "imagens/velociraptor.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Triceratops, que tem três chifres na cabeça?",
                correto: 1,
                explicacao: "O Triceratops usava seus três chifres e o escudo ósseo para se defender!",
                opcoes: [
                    { nome: "Estegossauro", img: "imagens/estegossauro.png" },
                    { nome: "Triceratops", img: "imagens/triceratops.png" },
                    { nome: "Braquiossauro", img: "imagens/braquiossauro.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Velociraptor, um caçador muito rápido e inteligente?",
                correto: 2,
                explicacao: "O Velociraptor era ágil e caçava em grupo!",
                opcoes: [
                    { nome: "Anquilossauro", img: "imagens/anquilossauro.png" },
                    { nome: "Alossauro", img: "imagens/alossauro.png" },
                    { nome: "Velociraptor", img: "imagens/velociraptor.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Estegossauro, que tem placas nas costas?",
                correto: 0,
                explicacao: "O Estegossauro tinha placas grandes nas costas e espinhos no rabo!",
                opcoes: [
                    { nome: "Estegossauro", img: "imagens/estegossauro.png" },
                    { nome: "T-Rex", img: "imagens/trex.png" },
                    { nome: "Diplodoco", img: "imagens/diplodoco.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Braquiossauro, que tem um pescoço gigante?",
                correto: 1,
                explicacao: "O Braquiossauro comia as folhas mais altas das árvores com seu pescoço comprido!",
                opcoes: [
                    { nome: "Paquicefalossauro", img: "imagens/paquicefalossauro.png" },
                    { nome: "Braquiossauro", img: "imagens/braquiossauro.png" },
                    { nome: "Espinossauro", img: "imagens/espinossauro.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Espinossauro, que tem uma vela enorme nas costas?",
                correto: 2,
                explicacao: "O Espinossauro adorava a água e comia peixes grandões!",
                opcoes: [
                    { nome: "Triceratops", img: "imagens/triceratops.png" },
                    { nome: "Alossauro", img: "imagens/alossauro.png" },
                    { nome: "Espinossauro", img: "imagens/espinossauro.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Anquilossauro, que parece um tanque blindado?",
                correto: 0,
                explicacao: "O Anquilossauro tinha uma carapaça dura e uma clava pesada na ponta da cauda!",
                opcoes: [
                    { nome: "Anquilossauro", img: "imagens/anquilossauro.png" },
                    { nome: "Estegossauro", img: "imagens/estegossauro.png" },
                    { nome: "Velociraptor", img: "imagens/velociraptor.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Alossauro, um grande predador carnívoro do período jurássico?",
                correto: 1,
                explicacao: "O Alossauro era um caçador feroz com dentes afiados como serras!",
                opcoes: [
                    { nome: "T-Rex", img: "imagens/trex.png" },
                    { nome: "Alossauro", img: "imagens/alossauro.png" },
                    { nome: "Braquiossauro", img: "imagens/braquiossauro.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Diplodoco, famoso por sua cauda em forma de chicote?",
                correto: 2,
                explicacao: "O Diplodoco era tão comprido que sua cauda parecia um chicote!",
                opcoes: [
                    { nome: "Triceratops", img: "imagens/triceratops.png" },
                    { nome: "Anquilossauro", img: "imagens/anquilossauro.png" },
                    { nome: "Diplodoco", img: "imagens/diplodoco.png" }
                ]
            },
            {
                pergunta: "Qual deles é o Paquicefalossauro, que tem a cabeça dura como um capacete?",
                correto: 0,
                explicacao: "O Paquicefalossauro tinha o topo da cabeça bem grosso e duro!",
                opcoes: [
                    { nome: "Paquicefalossauro", img: "imagens/paquicefalossauro.png" },
                    { nome: "Estegossauro", img: "imagens/estegossauro.png" },
                    { nome: "Velociraptor", img: "imagens/velociraptor.png" }
                ]
            }
        ];

        let indiceAtual = 0;

        function falar(texto, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                if (callback) utterance.onend = callback;
                window.speechSynthesis.speak(utterance);
            } else if (callback) {
                callback();
            }
        }

        function carregarPergunta() {
            const atual = quizData[indiceAtual];
            document.getElementById('texto-progresso').innerText = `Pergunta ${indiceAtual + 1} de 10`;
            document.getElementById('feedback').innerText = "";
            
            const containerOpcoes = document.getElementById('opcoes');
            containerOpcoes.innerHTML = '';

            atual.opcoes.forEach((opcao, index) => {
                const btn = document.createElement('button');
                btn.className = 'opcao-btn';
                btn.innerHTML = `<img src="${opcao.img}" alt="${opcao.nome}" onerror="this.onerror=null; this.src='https://via.placeholder.com/220/ff7675/fff?text=${encodeURIComponent(opcao.nome)}';">`;
                btn.onclick = () => verificarResposta(index);
                containerOpcoes.appendChild(btn);
            });

            falar(atual.pergunta);
        }

        function falarPerguntaAtual() {
            falar(quizData[indiceAtual].pergunta);
        }

        function verificarResposta(selecionado) {
            const atual = quizData[indiceAtual];
            const feedbackDiv = document.getElementById('feedback');

            if (selecionado === atual.correto) {
                feedbackDiv.style.color = "#27ae60";
                feedbackDiv.innerText = "🎉 Acertou! " + atual.explicacao;
                falar("Muito bem! Acertou! " + atual.explicacao, () => {
                    setTimeout(() => {
                        indiceAtual++;
                        if (indiceAtual < quizData.length) {
                            carregarPergunta();
                        } else {
                            document.getElementById('texto-progresso').innerText = "Fim do Jogo!";
                            document.getElementById('opcoes').innerHTML = "";
                            document.getElementById('audio-btn').style.display = "none";
                            feedbackDiv.innerText = "🏆 Você completou o quiz! Parabéns campeão!";
                            falar("Parabéns, você completou o quiz dos dinossauros!");
                        }
                    }, 4000);
                });
            } else {
                feedbackDiv.style.color = "#c0392b";
                feedbackDiv.innerText = "❌ Ops! Tente de novo!";
                falar("Ops, tente outro dinossauro!");
            }
        }

        window.onload = () => {
            carregarPergunta();
        };
    </script>
</body>
</html>
