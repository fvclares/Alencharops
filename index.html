            align-items: center;
            justify-content: center;

        }
        h1 {
            color: #d32f2f;
            font-size: 2.2rem;

        }
        .card-pergunta {
            background: #fff;

            border-radius: 20px;

            font-size: 1.8rem;
            color: #333;
            text-align: center;

        }
        .opcoes-container {

            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        .opcao-btn {
            background: white;
            border: 5px solid #4caf50;
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
            width: 220px;
            height: 220px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .opcao-btn:hover {
            transform: scale(1.05);
        }
        .opcao-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #audio-btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #feedback {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #388e3c;
            text-align: center;
            max-width: 600px;
            font-weight: bold;
        }

                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                if (callback) utterance.onend = callback;
                window.speechSynthesis.speak(utterance);
            } else if (callback) {
                callback();
            }
        }

        function carregarPergunta() {
            const atual = quizData[indiceAtual];
            document.getElementById('texto-pergunta').innerText = `Pergunta ${indiceAtual + 1} de 30: ${atual.pergunta}`;
            document.getElementById('feedback').innerText = "";
            
            const containerOpcoes = document.getElementById('opcoes');
            containerOpcoes.innerHTML = '';

            atual.opcoes.forEach((opcao, index) => {
                const btn = document.createElement('button');
                btn.className = 'opcao-btn';
                btn.innerHTML = `<img src="${opcao.img}" alt="${opcao.nome}">`;
                btn.onclick = () => verificarResposta(index);
                containerOpcoes.appendChild(btn);
            });

            falar(atual.pergunta);
        }

        function falarPerguntaAtual() {
            falar(quizData[indiceAtual].pergunta);
        }

        function verificarResposta(selecionado) {
            const atual = quizData[indiceAtual];
            const feedbackDiv = document.getElementById('feedback');

            if (selecionado === atual.correto) {
                feedbackDiv.style.color = "#388e3c";
                feedbackDiv.innerText = "🎉 Acertou! " + atual.explicacao;
                falar("Muito bem! Acertou! " + atual.explicacao, () => {
                    setTimeout(() => {
                        indiceAtual++;
                        if (indiceAtual < quizData.length) {
                            carregarPergunta();
                        } else {
                            document.getElementById('texto-pergunta').innerText = "Você terminou o quiz! Parabéns!";
                            document.getElementById('opcoes').innerHTML = "";
                            falar("Parabéns, você completou o quiz de todos os dinossauros!");
                        }
                    }, 2000);
                });
            } else {
                feedbackDiv.style.color = "#d32f2f";
                feedbackDiv.innerText = "Ops! Tente de novo!";
                falar("Ops, tente outro dinossauro!");
            }
        }

        window.onload = () => {
            carregarPergunta();
        };
    </script>
</body>
</html>
